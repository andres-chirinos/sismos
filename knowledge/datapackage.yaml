name: sismos
title: Sismología de Bolivia — Observatorio San Calixto
description: Catálogo oficial de eventos sísmicos registrados en Bolivia con coordenadas epicentrales, profundidad y magnitud Richter.

spatial:
  country: BO
  regions: [BO-L, BO-P, BO-O, BO-C, BO-S, BO-H, BO-T, BO-B, BO-N]
  bbox: [-69.64, -22.90, -57.45, -9.67]
  granularity: point

temporal:
  start: 2009-04-18T11:29:00Z
  end: 2026-10-04T08:07:55Z
  frequency: irregular
  timezone: America/La_Paz

quality:
  status: verified
  completeness: 1.0
  checks:
    - rule: no_nulls
      field: fecha_hora_registro
    - rule: range
      field: magnitud
      min: 0.0
      max: 10.0

resources:
  - name: sismology
    title: Compilación de datos de sismología de Bolivia (CSV)
    type: table
    path: ../data/sismology.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema:
      fields:
        - name: enlace_detalle
          type: string
          description: Enlace al detalle del sismo
        - name: magnitud
          type: number
          description: Magnitud del sismo (escala de Richter)
          concept: concepts/richter_magnitude_scale.md
        - name: region_base
          type: string
          description: Región base del sismo
        - name: profundidad
          type: number
          description: Profundidad del sismo
        - name: distancia_epicentral
          type: string
          description: Distancia epicentral del sismo
        - name: observaciones
          type: string
          description: Observaciones adicionales
        - name: responsable
          type: string
          description: Responsable del registro
        - name: referencias
          type: string
          description: Referencias del registro
        - name: fecha_hora_registro
          type: datetime
          description: Fecha y hora del registro
        - name: latitud
          type: number
          description: Latitud del sismo
        - name: longitud
          type: number
          description: Longitud del sismo
        - name: fuente
          type: string
          description: Fuente de los datos
  - name: sismology-parquet
    title: Compilación de datos de sismología de Bolivia (Parquet)
    type: table
    path: ../data/sismology.parquet
    scheme: file
    format: parquet
    mediatype: application/vnd.apache.parquet
    schema:
      fields:
        - name: enlace_detalle
          type: string
          description: Enlace al detalle del sismo
        - name: magnitud
          type: number
          description: Magnitud del sismo (escala de Richter)
          concept: concepts/richter_magnitude_scale.md
        - name: region_base
          type: string
          description: Región base del sismo
        - name: profundidad
          type: number
          description: Profundidad del sismo
        - name: distancia_epicentral
          type: string
          description: Distancia epicentral del sismo
        - name: observaciones
          type: string
          description: Observaciones adicionales
        - name: responsable
          type: string
          description: Responsable del registro
        - name: referencias
          type: string
          description: Referencias del registro
        - name: fecha_hora_registro
          type: datetime
          description: Fecha y hora del registro
        - name: latitud
          type: number
          description: Latitud del sismo
        - name: longitud
          type: number
          description: Longitud del sismo
        - name: fuente
          type: string
          description: Fuente de los datos
